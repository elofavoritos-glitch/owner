name: CI

# Rede automática: roda a cada push e pull request, checando tipos, lint e build
# do app Next.js. Não bloqueia o trabalho local — reporta o resultado no PR.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  web:
    name: Checar web_app_nextjs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_app_nextjs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web_app_nextjs/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (next build)
        run: npm run build
        env:
          # Variáveis públicas de placeholder só para o build passar no CI.
          # Não são segredos; o app real usa as Secrets configuradas na Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
